name: Character movement tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-movement:
    name: Character movement
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4

      - name: Run character movement tests
        run: lua5.4 tests/run.lua
